name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and lint
        run: gradle --no-daemon assembleDebug assembleAndroidTest lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Flowstudio-test-APK
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: app/build/reports/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android integration checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.flowstudio.app.test/com.flowstudio.app.SmokeInstrumentation > /tmp/instrumentation.txt
            cat /tmp/instrumentation.txt
            grep -q 'checks passed' /tmp/instrumentation.txt

      - name: Decode permanent release signing key
        env:
          STORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$STORE_BASE64" ]; then
            printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flowstudio.jks"
            echo "RELEASE_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Signed release APK and AAB
        if: env.RELEASE_READY == 'true'
        env:
          SIGNING_STORE: ${{ runner.temp }}/flowstudio.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_READY == 'true'
        with:
          name: Flowstudio-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/flowstudio.jks"
